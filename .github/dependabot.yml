# Version ranges do not gate Dependabot; `ignore` does.
# `ignore` also filters security update PRs, so a blocked fix shows up as an
# alert without a PR instead of silently disappearing.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    groups:
      next-toolchain:
        patterns: ["next", "eslint-config-next", "@next/*"]
      routine:
        patterns: ["*"]
        update-types: [patch, minor]
    ignore:
      # Patch releases only: frozen visual layer and 0.x packages.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: "@tailwindcss/postcss"
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: "@tailwindcss/typography"
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: daisyui
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: lucide-react
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-minor, version-update:semver-major]
      # No major updates without a manual decision.
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: eslint-config-next
        update-types: [version-update:semver-major]
      - dependency-name: "@next/bundle-analyzer"
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: "@vercel/analytics"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: postcss
        update-types: [version-update:semver-major]